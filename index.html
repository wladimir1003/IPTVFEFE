<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b101c"><meta name="description" content="Reproductor IPTV multiplataforma para listas autorizadas"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/styles.css"><title>Magma TV Player Latino Pro</title></head><body>
<div id="app"><aside id="sidebar"><div class="brand">🔥 <span>MAGMA TV</span><small>LATINO PRO</small></div><nav aria-label="Navegación principal"><button class="nav focusable" data-view="live">◉ <span>TV en vivo</span></button><button class="nav focusable" data-view="movies">▣ <span>Películas</span></button><button class="nav focusable" data-view="series">▤ <span>Series</span></button><button class="nav focusable" data-view="favorites">★ <span>Favoritos</span></button><button class="nav focusable" data-view="settings">⚙ <span>Configuración</span></button></nav><p class="sidebar-note">Flechas · OK · Volver</p></aside><main><header><div><div class="eyebrow">MAGMA / EXPLORAR</div><h1 id="title">TV en vivo</h1></div><div class="header-right"><span id="status" role="status">Listo para configurar</span><button id="menuToggle" class="focusable icon-btn" aria-label="Contraer menú">☰</button></div></header><div id="toolbar"></div><div id="content" tabindex="-1"></div></main></div>
